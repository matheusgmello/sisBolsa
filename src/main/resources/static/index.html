<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SisBolsa</title>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <div class="logo-icon">
            <i class="fas fa-graduation-cap"></i>
        </div>
        <h1>SisBolsa</h1>
        <h2>Acesse sua conta</h2>

        <form id="form-login">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="seu@email.com" name="email" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input id="senha" type="password" placeholder="Sua senha" name="senha" required>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> ENTRAR
            </button>
        </form>

        <div id="avisos"></div>

        <div class="link-cadastro-admin">
            <a href="/cadastro-admin.html"><i class="fas fa-user-shield"></i> Cadastrar administrador</a>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script>
        document.getElementById("form-login").addEventListener("submit", async (e) => {
            e.preventDefault();
            Util.limpaAviso();
            try {
                await Api.post("/auth/login", {
                    email: document.getElementById("email").value.trim(),
                    senha: document.getElementById("senha").value.trim()
                });
                window.location.href = "/dashboard.html";
            } catch (erro) {
                Util.aviso(erro.message);
            }
        });
    </script>
</body>
</html>
