<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto - SisBolsa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cadastro-bolsista.css">
</head>
<body>
    <div class="main-content">
        <div class="container form-container" style="max-width:760px;margin:30px auto;">
            <h1>
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle; margin-right: 8px; color: var(--primary-color);"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                <span id="titulo">Cadastrar Novo Projeto</span>
            </h1>
            <p class="legenda-obrigatorio"><span class="asterisco">*</span> Campos obrigatórios</p>

            <div id="avisos" aria-live="polite" role="status"></div>

            <form id="formProjeto">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label for="nome">Nome do Projeto <span class="asterisco">*</span></label>
                        <input type="text" id="nome" required minlength="3" placeholder="Ex: IA Generativa na Educação">
                    </div>
                    <div class="form-group form-group-full">
                        <label for="laboratorioId">Laboratório Responsável <span class="asterisco">*</span></label>
                        <select id="laboratorioId" required><option value="">Selecione o laboratório...</option></select>
                    </div>
                    <div class="form-group form-group-full">
                        <label for="descricao">Descrição do Projeto</label>
                        <textarea id="descricao" rows="5" placeholder="Descreva os objetivos, tecnologias envolvidas e o escopo do projeto..."></textarea>
                    </div>
                    <div class="actions" style="margin-top:20px;">
                        <button type="submit" class="btn btn-submit" id="btn-salvar-proj">
                            <span class="btn-spinner" aria-hidden="true"></span>
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                            <span id="rotulo-salvar">Salvar Projeto</span>
                        </button>
                        <a href="/projetos.html" class="btn btn-cancel">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/projeto-form.js"></script>
</body>
</html>
