<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto - SisBolsa</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cadastro-bolsista.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-content">
        <div class="container form-container" style="max-width:800px;margin:40px auto;">
            <h1><i class="fas fa-project-diagram"></i> <span id="titulo">Cadastrar Novo Projeto</span></h1>
            <p class="legenda-obrigatorio"><span class="asterisco">*</span> Campos obrigatórios</p>

            <div id="avisos"></div>

            <form id="formProjeto">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label for="nome">Nome do Projeto <span class="asterisco">*</span></label>
                        <input type="text" id="nome" required minlength="3" placeholder="Ex: IA Generativa na Educação">
                    </div>
                    <div class="form-group form-group-full">
                        <label for="laboratorioId">Laboratório Responsável <span class="asterisco">*</span></label>
                        <select id="laboratorioId" required><option value="">Selecione o laboratório...</option></select>
                    </div>
                    <div class="form-group form-group-full">
                        <label for="descricao">Descrição do Projeto</label>
                        <textarea id="descricao" rows="6" placeholder="Descreva os objetivos, tecnologias envolvidas e o escopo do projeto..."></textarea>
                    </div>
                    <div class="actions" style="margin-top:20px;">
                        <button type="submit" class="btn btn-submit"><i class="fas fa-save"></i> <span id="rotulo-salvar">Salvar Projeto</span></button>
                        <a href="/projetos.html" class="btn btn-cancel">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/projeto-form.js"></script>
</body>
</html>
