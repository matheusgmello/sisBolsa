<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório - SisBolsa</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cadastro-laboratorio.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-content">
        <div class="container">
            <h1><i class="fas fa-flask"></i> <span id="titulo">Cadastrar Novo Laboratório</span></h1>
            <p class="legenda-obrigatorio"><span class="asterisco">*</span> Campos obrigatórios</p>

            <div id="avisos"></div>

            <form id="formLab">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label>Nome do Laboratório <span class="asterisco">*</span></label>
                        <input type="text" id="nome" required minlength="3" placeholder="Ex: Lab de Inteligência Artificial">
                    </div>
                    <div class="form-group">
                        <label>Área de Pesquisa <span class="asterisco">*</span></label>
                        <input type="text" id="areaPesquisa" required placeholder="Ex: Computação, Química, Engenharia">
                    </div>
                    <div class="form-group">
                        <label>Professor Coordenador <span class="asterisco">*</span></label>
                        <select id="coordenadorId" required><option value="">Selecione um professor...</option></select>
                    </div>
                    <div class="form-group">
                        <label>Capacidade Máxima <span class="asterisco">*</span></label>
                        <input type="number" id="capacidade" value="10" required min="1" placeholder="Ex: 10">
                    </div>
                    <div class="form-group">
                        <label>Status <span class="asterisco">*</span></label>
                        <select id="status" required>
                            <option value="">Selecione o status...</option>
                            <option value="Ativo">Ativo</option>
                            <option value="Em Pausa">Em Pausa</option>
                            <option value="Concluido">Concluído</option>
                        </select>
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn btn-submit"><i class="fas fa-save"></i> Salvar Laboratório</button>
                        <a href="/laboratorios.html" class="btn btn-cancel">Cancelar</a>
                    </div>
                </div>
            </form>

            <div class="secao-projetos" id="secao-projetos" hidden>
                <h2><i class="fas fa-project-diagram"></i> Projetos Cadastrados no Laboratório</h2>
                <div class="projetos-grid" id="grid-projetos"></div>

                <div class="form-projeto-box">
                    <h3><i class="fas fa-plus-circle" id="icone-projeto"></i> <span id="titulo-projeto">Adicionar Novo Projeto</span></h3>
                    <form id="form-projeto">
                        <div class="form-projeto-grid">
                            <div class="form-group">
                                <label for="nomeProj">Nome do Projeto <span class="asterisco">*</span></label>
                                <input type="text" id="nomeProj" required minlength="3" placeholder="Ex: Desenvolvimento App Mobile">
                            </div>
                            <div class="form-group">
                                <label for="descProj">Descrição do Projeto</label>
                                <textarea id="descProj" placeholder="Descreva os objetivos, tecnologias e escopo do projeto..."></textarea>
                            </div>
                            <div class="proj-actions">
                                <button type="submit" class="btn-proj-save"><i class="fas fa-check"></i> <span id="rotulo-salvar-projeto">Cadastrar Projeto</span></button>
                                <a href="#" class="btn-proj-cancel" id="cancelar-projeto" hidden>Cancelar</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/laboratorio-form.js"></script>
</body>
</html>
