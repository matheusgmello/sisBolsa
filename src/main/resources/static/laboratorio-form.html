<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório - SisBolsa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cadastro-laboratorio.css">
</head>
<body>
    <div class="main-content">
        <div class="header-actions">
            <div>
                <h1 id="titulo">Cadastrar Novo Laboratório</h1>
                <p class="legenda-obrigatorio"><span class="asterisco">*</span> Campos marcados com asterisco são obrigatórios</p>
            </div>
            <div class="header-buttons">
                <a href="/laboratorios.html" class="btn-new btn-export">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    <span>Voltar para Lista</span>
                </a>
            </div>
        </div>

        <div id="avisos" aria-live="polite" role="status"></div>

        <div class="container form-container">
            <form id="formLab">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label for="nome">Nome do Laboratório <span class="asterisco">*</span></label>
                        <input type="text" id="nome" required minlength="3" placeholder="Ex: Lab de Inteligência Artificial">
                    </div>
                    <div class="form-group">
                        <label for="areaPesquisa">Área de Pesquisa <span class="asterisco">*</span></label>
                        <input type="text" id="areaPesquisa" required placeholder="Ex: Computação, Química, Engenharia">
                    </div>
                    <div class="form-group">
                        <label for="coordenadorId">Professor Coordenador <span class="asterisco">*</span></label>
                        <select id="coordenadorId" required><option value="">Selecione um professor...</option></select>
                    </div>
                    <div class="form-group">
                        <label for="capacidade">Capacidade Máxima <span class="asterisco">*</span></label>
                        <input type="number" id="capacidade" value="10" required min="1" placeholder="Ex: 10">
                    </div>
                    <div class="form-group">
                        <label for="status">Status <span class="asterisco">*</span></label>
                        <select id="status" required>
                            <option value="">Selecione o status...</option>
                            <option value="Ativo">Ativo</option>
                            <option value="Em Pausa">Em Pausa</option>
                            <option value="Concluido">Concluído</option>
                        </select>
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn btn-submit" id="btn-salvar-lab">
                            <span class="btn-spinner" aria-hidden="true"></span>
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                            <span class="btn-text">Salvar Laboratório</span>
                        </button>
                        <a href="/laboratorios.html" class="btn btn-cancel">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/laboratorio-form.js"></script>
</body>
</html>
