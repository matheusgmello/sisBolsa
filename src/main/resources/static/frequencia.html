<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequência - SisBolsa</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/frequencia.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-content">
        <h1><i class="fas fa-calendar-check"></i> Registro de Frequência</h1>

        <div class="stats-grid" id="resumo" style="display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap;" hidden></div>

        <div id="avisos"></div>

        <div class="container form-container">
            <h2 id="titulo-form">Novo Registro</h2>
            <form class="frequency-form" id="form-frequencia">
                <div class="form-group-full">
                    <label>Bolsista</label>
                    <select id="bolsistaSelect" required hidden>
                        <option value="">Selecione o bolsista...</option>
                    </select>
                    <input type="text" id="bolsistaFixo" disabled hidden>
                </div>
                <div class="form-row">
                    <div class="form-col">
                        <label>Data</label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="form-col">
                        <label>Horas</label>
                        <input type="number" step="0.5" id="horas" required placeholder="Ex: 4.5">
                    </div>
                </div>
                <div>
                    <label>Descrição das Atividades</label>
                    <textarea id="descricao" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-button"><i class="fas fa-save"></i> <span id="rotulo-salvar">Registrar Horas</span></button>
                    <a href="/frequencia.html" class="cancel-button" id="cancelar" hidden><i class="fas fa-times"></i> Cancelar</a>
                </div>
            </form>
        </div>

        <div class="container">
            <div class="history-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:15px;">
                <h2 style="margin:0;"><i class="fas fa-history"></i> Histórico de Atividades</h2>
                <div class="history-actions" style="display:flex;gap:15px;align-items:center;flex-wrap:wrap;">
                    <form class="filter-form" id="form-filtro" style="display:flex;gap:10px;align-items:center;" hidden>
                        <select id="filtro-bolsista" style="padding:8px 12px;border:1px solid #ccc;border-radius:4px;font-size:0.9rem;">
                            <option value="">Todos os Bolsistas</option>
                        </select>
                        <button type="submit" class="submit-button" style="padding:8px 15px;border-radius:4px;font-size:0.9rem;margin:0;"><i class="fas fa-filter"></i> Filtrar</button>
                    </form>
                    <a href="/api/frequencias/exportar" id="btn-exportar" class="submit-button"
                       style="padding:8px 15px;border-radius:4px;font-size:0.9rem;margin:0;background-color:#27ae60;text-decoration:none;display:inline-flex;align-items:center;gap:5px;color:white;">
                        <i class="fas fa-file-csv"></i> Exportar CSV
                    </a>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead><tr><th>Bolsista</th><th>Data</th><th>Horas</th><th>Atividade</th><th>Ações</th></tr></thead>
                    <tbody id="corpo"></tbody>
                </table>
            </div>

            <div class="pagination" id="paginacao" style="display:flex;justify-content:center;gap:15px;margin-top:20px;align-items:center;"></div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/frequencia.js"></script>
</body>
</html>
