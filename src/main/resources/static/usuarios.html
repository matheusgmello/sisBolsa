<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários - SisBolsa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/bolsistas.css">
</head>
<body>
    <div class="main-content">
        <div class="header-actions">
            <div>
                <h1 id="titulo">Gerenciar Usuários</h1>
                <p class="header-subtitle">Cadastro e controle de acesso de bolsistas, professores e administradores</p>
            </div>
            <div class="header-buttons">
                <a href="/api/usuarios/exportar" class="btn-new btn-export">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Exportar CSV</span>
                </a>
                <button type="button" class="btn-new btn-primary" id="btn-novo">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <span id="rotulo-novo">Novo Usuário</span>
                </button>
            </div>
        </div>

        <div id="avisos" aria-live="polite" role="status"></div>

        <div class="container">
            <div class="search-section">
                <form class="search-toolbar" id="form-busca">
                    <div class="search-field">
                        <label for="busca-nome" class="sr-only">Pesquisar por nome</label>
                        <input type="text" id="busca-nome" placeholder="Pesquisar por nome..." class="search-input" aria-label="Pesquisar por nome">
                    </div>
                    
                    <div class="search-field">
                        <label for="busca-curso" class="sr-only">Filtrar por curso</label>
                        <input type="text" id="busca-curso" placeholder="Filtrar por curso..." class="search-input" aria-label="Filtrar por curso">
                    </div>
                    
                    <button type="submit" class="search-button" aria-label="Buscar usuários">
                        <span>Buscar</span>
                    </button>
                    
                    <a href="/usuarios.html" class="reset-button" title="Limpar busca e filtros" aria-label="Limpar busca e filtros">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        <span>Limpar</span>
                    </a>
                </form>
            </div>

            <div class="filter-pills" id="filtros" hidden>
                <span class="filter-label">Tipo:</span>
                <a href="/usuarios.html" class="pill-btn" data-tipo="">Todos</a>
                <a href="/usuarios.html?tipo=BOLSISTA" class="pill-btn" data-tipo="BOLSISTA">Bolsistas</a>
                <a href="/usuarios.html?tipo=PROFESSOR" class="pill-btn" data-tipo="PROFESSOR">Professores</a>
                <a href="/usuarios.html?tipo=ADMIN" class="pill-btn" data-tipo="ADMIN">Administradores</a>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th><th>Curso</th><th>Cargo</th>
                            <th>Laboratório</th><th>Tipo</th><th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo"></tbody>
                </table>
            </div>

            <div class="pagination" id="paginacao"
                 style="display:flex;justify-content:center;gap:15px;margin-top:20px;align-items:center;"></div>
        </div>
    </div>

    <!-- Modal Cadastro / Edicao de Usuario -->
    <div class="modal-overlay" id="modal-usuario" role="dialog" aria-modal="true" aria-labelledby="modal-usuario-titulo">
        <div class="modal-dialog" style="max-width: 640px;">
            <div class="modal-header">
                <h2 id="modal-usuario-titulo">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--primary-color);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span id="label-modal-usuario">Cadastrar Novo Usuário</span>
                </h2>
                <button type="button" class="modal-close-btn" data-fecha-modal="modal-usuario" aria-label="Fechar janela modal">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="form-modal-usuario">
                <input type="hidden" id="modal-user-id">
                <input type="hidden" id="modal-user-tipo-original">
                <div class="modal-body" style="max-height: calc(85vh - 140px); overflow-y: auto;">
                    <div class="form-group" id="modal-group-tipo" style="margin-bottom: 14px;" hidden>
                        <label for="modal-tipo" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Tipo de Usuário <span class="asterisco">*</span></label>
                        <select id="modal-tipo" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                            <option value="BOLSISTA">Bolsista</option>
                            <option value="PROFESSOR">Professor</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
                        <div class="form-group">
                            <label for="modal-nome" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Nome Completo <span class="asterisco">*</span></label>
                            <input type="text" id="modal-nome" required minlength="3" placeholder="Ex: Ana Clara Silva" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                        </div>
                        <div class="form-group">
                            <label for="modal-email" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">E-mail <span class="asterisco">*</span></label>
                            <input type="email" id="modal-email" required placeholder="Ex: ana.silva@universidade.edu.br" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
                        <div class="form-group">
                            <label for="modal-senha" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Senha <span class="asterisco" id="modal-senha-asterisco">*</span></label>
                            <div class="password-field-wrapper">
                                <input type="password" id="modal-senha" minlength="6" placeholder="Mínimo de 6 caracteres" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                                <button type="button" class="password-toggle-btn" data-target="modal-senha" aria-label="Mostrar ou ocultar senha">
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="modal-foto" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">URL da Foto de Perfil</label>
                            <input type="url" id="modal-foto" placeholder="https://exemplo.com/foto.jpg" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                        </div>
                    </div>

                    <div id="modal-secao-bolsista">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
                            <div class="form-group" id="modal-group-lab">
                                <label for="modal-lab" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Laboratório <span class="asterisco">*</span></label>
                                <select id="modal-lab" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                                    <option value="">Selecione um laboratório...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="modal-cargo" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Cargo no Laboratório</label>
                                <select id="modal-cargo" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                                    <option value="">Selecione um cargo...</option>
                                </select>
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
                            <div class="form-group">
                                <label for="modal-curso" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Curso de Graduação</label>
                                <input type="text" id="modal-curso" placeholder="Ex: Engenharia de Software" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                            </div>
                            <div class="form-group">
                                <label for="modal-matricula" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Matrícula Acadêmica</label>
                                <input type="text" id="modal-matricula" placeholder="Ex: 202410123" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
                            <div class="form-group">
                                <label for="modal-cpf" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">CPF</label>
                                <input type="text" id="modal-cpf" placeholder="000.000.000-00" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                            </div>
                            <div class="form-group">
                                <label for="modal-telefone" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Telefone / WhatsApp</label>
                                <input type="tel" id="modal-telefone" placeholder="(00) 00000-0000" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="modal-dataNasc" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Data de Nascimento</label>
                            <input type="date" id="modal-dataNasc" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" data-fecha-modal="modal-usuario" style="flex:0 1 auto;padding:9px 18px;">Cancelar</button>
                    <button type="submit" class="btn btn-submit" id="btn-modal-salvar-user" style="flex:0 1 auto;padding:9px 20px;">
                        <span class="btn-spinner" aria-hidden="true"></span>
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        <span id="label-btn-salvar-user">Salvar Usuário</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/usuarios.js"></script>
</body>
</html>
