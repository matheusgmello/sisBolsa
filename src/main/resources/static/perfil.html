<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - SisBolsa</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-content">
        <div class="container form-container">
            <h1><i class="fas fa-user-cog"></i> Editar Perfil</h1>

            <div class="profile-header-display" id="cabecalho"></div>
            <div id="avisos"></div>

            <form id="formPerfil">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label>Nome Completo <span class="asterisco">*</span></label>
                        <input type="text" id="nome" required minlength="3" placeholder="Ex: João da Silva">
                    </div>
                    <div class="form-group">
                        <label>E-mail <span class="asterisco">*</span></label>
                        <input type="email" id="email" required placeholder="Ex: email@universidade.edu.br">
                    </div>
                    <div class="form-group">
                        <label>URL da Foto de Perfil</label>
                        <input type="text" id="fotoUrl" placeholder="https://exemplo.com/foto.jpg">
                    </div>
                    <div class="form-group form-group-full">
                        <label>Biografia / Sobre Mim</label>
                        <textarea id="bio" rows="4" placeholder="Escreva um resumo sobre você, suas habilidades, hobbies e interesses..."></textarea>
                    </div>
                    <div class="form-group form-group-full" style="border-top:1px solid #ddd;margin-top:15px;padding-top:15px;">
                        <h3 style="margin-bottom:5px;font-size:1.1rem;color:#333;">Alterar Senha</h3>
                        <p style="font-size:0.85rem;color:#666;margin-bottom:5px;">Preencha os campos abaixo apenas se desejar alterar sua senha.</p>
                    </div>
                    <div class="form-group form-group-full">
                        <label>Senha Atual</label>
                        <input type="password" id="senhaAtual" placeholder="Digite sua senha atual para autorizar a alteração">
                    </div>
                    <div class="form-group">
                        <label>Nova Senha</label>
                        <input type="password" id="senha" minlength="6" placeholder="Mínimo 6 caracteres">
                    </div>
                    <div class="form-group">
                        <label>Confirmar Nova Senha</label>
                        <input type="password" id="confirmaSenha" minlength="6" placeholder="Confirme a nova senha">
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn btn-submit"><i class="fas fa-save"></i> Salvar Alterações</button>
                        <a href="/dashboard.html" class="btn btn-cancel">Voltar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/perfil.js"></script>
</body>
</html>
