<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Projeto - SisBolsa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/detalhes-laboratorio.css">
</head>
<body>
    <div class="main-content">
        <div class="header-actions">
            <div>
                <h1 id="nome-projeto">Carregando Projeto...</h1>
                <p class="header-subtitle">Visualização de integrantes, laboratório gestor e escopo</p>
            </div>
            <div class="header-buttons">
                <button type="button" class="btn-new btn-primary" id="btn-abrir-vincular" hidden>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <span>Vincular Bolsista</span>
                </button>
                <a href="/projetos.html" class="btn-new btn-export">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    <span>Voltar para Projetos</span>
                </a>
            </div>
        </div>

        <div id="avisos" aria-live="polite" role="status"></div>
        <div class="lab-info-grid" id="info"></div>
        <div class="project-details-full" id="detalhes"></div>
    </div>

    <!-- Modal Vincular Bolsista -->
    <div class="modal-overlay" id="modal-vincular" role="dialog" aria-modal="true" aria-labelledby="modal-vincular-titulo">
        <div class="modal-dialog">
            <div class="modal-header">
                <h2 id="modal-vincular-titulo">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--primary-color);"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                    <span>Vincular Bolsista ao Projeto</span>
                </h2>
                <button type="button" class="modal-close-btn" data-fecha-modal="modal-vincular" aria-label="Fechar janela modal">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="form-vincular">
                <div class="modal-body">
                    <p style="font-size:0.875rem;color:var(--text-secondary);margin:0 0 16px 0;line-height:1.45;">
                        Selecione um bolsista vinculado ao laboratório gestor para integrá-lo a este projeto.
                    </p>
                    <div class="form-group">
                        <label for="bolsistaId" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Bolsista Disponível <span class="asterisco">*</span></label>
                        <select id="bolsistaId" required style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;">
                            <option value="">Selecione um bolsista...</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" data-fecha-modal="modal-vincular" style="flex:0 1 auto;padding:9px 18px;">Cancelar</button>
                    <button type="submit" class="btn btn-submit" id="btn-vincular-submit" style="flex:0 1 auto;padding:9px 20px;">
                        <span class="btn-spinner" aria-hidden="true"></span>
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M20 6 9 17l-5-5"/></svg>
                        <span>Confirmar Vínculo</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/projeto-detalhes.js"></script>
</body>
</html>
