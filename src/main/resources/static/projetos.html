<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos - SisBolsa</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/laboratorios.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .membros-list-container { display:flex; flex-wrap:wrap; gap:6px; max-width:300px; }
        .badge-membro {
            background-color:#e0f2fe; color:#0369a1; padding:3px 8px;
            border-radius:var(--radius-sm); font-size:0.75rem; font-weight:500;
            border:1px solid #bae6fd; display:inline-flex; align-items:center; gap:4px;
        }
        .projeto-desc {
            max-width:350px; overflow:hidden; text-overflow:ellipsis; white-space:normal;
            font-size:0.85rem; color:var(--text-muted); line-height:1.4;
        }
        .btn-new-proj { background-color:var(--primary-color); color:white; }
        .btn-new-proj:hover { background-color:var(--primary-hover); }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="header-actions">
            <h1>Gerenciar Projetos</h1>
            <a href="/projeto-form.html" class="btn-new btn-new-proj" id="btn-novo" hidden>
                <i class="fas fa-plus"></i> Cadastrar Novo Projeto
            </a>
        </div>

        <div id="avisos"></div>

        <div class="container">
            <div class="search-section">
                <form class="search-form" id="form-busca">
                    <input type="text" id="busca-nome" placeholder="Pesquisar projeto por nome ou descrição..." class="search-input">
                    <button type="submit" class="search-button"><i class="fas fa-search"></i> Pesquisar</button>
                </form>
                <form class="search-form">
                    <select id="filtro-lab" class="search-input">
                        <option value="">Todos os Laboratórios</option>
                    </select>
                </form>
                <a href="/projetos.html" class="reset-button" id="limpar" title="Limpar todos os filtros" hidden><i class="fas fa-sync"></i></a>
            </div>

            <h2><i class="fas fa-project-diagram"></i> Listagem de Projetos Ativos</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Projeto</th><th>Descrição</th><th>Laboratório</th>
                            <th>Coordenador</th><th>Bolsistas Vinculados</th><th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/projetos.js"></script>
</body>
</html>
