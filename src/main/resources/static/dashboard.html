<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SisBolsa</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card-stat {
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--primary-color);
            background-color: rgba(74, 144, 226, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .btn-detalhes-link { text-decoration: none; transition: color 0.2s; }
        .btn-detalhes-link:hover { color: var(--primary-dark) !important; }
    </style>
</head>
<body>
    <div class="main-content">
        <header class="dashboard-header">
            <h1 id="titulo">Painel</h1>
            <div class="welcome-msg">Bem-vindo, <strong id="nome-usuario"></strong>!</div>
        </header>
        <div id="avisos"></div>
        <div id="conteudo"></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
