<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Administrador - SisBolsa</title>
    <link rel="stylesheet" href="/css/cadastro-admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cadastro-container">
        <div class="logo-icon"><i class="fas fa-user-shield"></i></div>
        <h1>SisBolsa</h1>
        <h2>Cadastro de Administrador</h2>
        <p class="subtitulo">
            Crie uma conta de administrador do sistema.
            <br><small id="vagas"></small>
        </p>

        <p class="legenda-obrigatorio"><span class="asterisco">*</span> Campos obrigatórios</p>

        <form id="form-admin">
            <div class="form-group">
                <label for="nome">Nome completo <span class="asterisco">*</span></label>
                <input type="text" id="nome" placeholder="Seu nome completo" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail <span class="asterisco">*</span></label>
                <input type="email" id="email" placeholder="admin@exemplo.com" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha <span class="asterisco">*</span></label>
                <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required>
            </div>
            <div class="form-group">
                <label for="confirmaSenha">Confirmar senha <span class="asterisco">*</span></label>
                <input type="password" id="confirmaSenha" placeholder="Repita a senha" required>
            </div>
            <button type="submit" class="btn-cadastrar"><i class="fas fa-user-plus"></i> CADASTRAR ADMINISTRADOR</button>
        </form>

        <div id="avisos"></div>

        <div class="link-voltar">
            <a href="/index.html"><i class="fas fa-arrow-left"></i> Voltar para o login</a>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script>
        (async () => {
            try {
                const r = await Api.get("/auth/admins-restantes");
                document.getElementById("vagas").textContent = `Vagas disponíveis: ${r.restantes} de 3.`;
                if (r.restantes === 0) {
                    document.getElementById("form-admin").hidden = true;
                    Util.aviso("O sistema já possui o número máximo de administradores (3).");
                }
            } catch (e) {
                Util.aviso(e.message);
            }
        })();

        document.getElementById("form-admin").addEventListener("submit", async (e) => {
            e.preventDefault();
            Util.limpaAviso();
            try {
                await Api.post("/auth/cadastro-admin", {
                    nome: document.getElementById("nome").value,
                    email: document.getElementById("email").value,
                    senha: document.getElementById("senha").value,
                    confirmaSenha: document.getElementById("confirmaSenha").value
                });
                window.location.href = "/index.html?cadastro=ok";
            } catch (erro) {
                Util.aviso(erro.message);
            }
        });
    </script>
</body>
</html>
