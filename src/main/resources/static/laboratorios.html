<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratórios - SisBolsa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/laboratorios.css">
</head>
<body>
    <div class="main-content">
        <div class="header-actions">
            <div>
                <h1>Gerenciar Laboratórios</h1>
                <p class="header-subtitle">Espaços de pesquisa, capacidade e coordenação docente</p>
            </div>
            <button type="button" class="btn-new btn-primary" id="btn-novo" hidden>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>Cadastrar Novo Laboratório</span>
            </button>
        </div>

        <div id="avisos" aria-live="polite" role="status"></div>

        <div class="container">
            <h2 class="section-title">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v7.31M14 2v7.31M8.5 2h7M14 9.3a6.5 6.5 0 1 1-4 0"/></svg>
                <span>Listagem de Laboratórios</span>
            </h2>
            <div class="table-container">
                <table>
                    <thead><tr id="cabecalho"></tr></thead>
                    <tbody id="corpo"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Cadastro / Edicao de Laboratorio -->
    <div class="modal-overlay" id="modal-laboratorio" role="dialog" aria-modal="true" aria-labelledby="modal-lab-titulo">
        <div class="modal-dialog">
            <div class="modal-header">
                <h2 id="modal-lab-titulo">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--primary-color);"><path d="M10 2v7.31M14 2v7.31M8.5 2h7M14 9.3a6.5 6.5 0 1 1-4 0"/></svg>
                    <span id="label-modal-lab">Cadastrar Novo Laboratório</span>
                </h2>
                <button type="button" class="modal-close-btn" data-fecha-modal="modal-laboratorio" aria-label="Fechar janela modal">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="form-modal-lab">
                <input type="hidden" id="lab-id">
                <div class="modal-body">
                    <div class="form-group" style="margin-bottom: 14px;">
                        <label for="modal-nome-lab" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Nome do Laboratório <span class="asterisco">*</span></label>
                        <input type="text" id="modal-nome-lab" required minlength="3" placeholder="Ex: Laboratório de Inteligência Artificial" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                    </div>
                    <div class="form-group" style="margin-bottom: 14px;">
                        <label for="modal-area-lab" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Área de Pesquisa <span class="asterisco">*</span></label>
                        <input type="text" id="modal-area-lab" required placeholder="Ex: Ciência da Computação, Engenharia de Software" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                    </div>
                    <div class="form-group" style="margin-bottom: 14px;">
                        <label for="modal-coord-lab" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Professor Coordenador <span class="asterisco">*</span></label>
                        <select id="modal-coord-lab" required style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                            <option value="">Selecione um professor...</option>
                        </select>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group">
                            <label for="modal-capacidade-lab" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Capacidade Máxima <span class="asterisco">*</span></label>
                            <input type="number" id="modal-capacidade-lab" required min="1" value="10" placeholder="Ex: 10" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                        </div>
                        <div class="form-group">
                            <label for="modal-status-lab" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Status <span class="asterisco">*</span></label>
                            <select id="modal-status-lab" required style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                                <option value="Ativo">Ativo</option>
                                <option value="Em Pausa">Em Pausa</option>
                                <option value="Concluido">Concluído</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" data-fecha-modal="modal-laboratorio" style="flex:0 1 auto;padding:9px 18px;">Cancelar</button>
                    <button type="submit" class="btn btn-submit" id="btn-modal-salvar-lab" style="flex:0 1 auto;padding:9px 20px;">
                        <span class="btn-spinner" aria-hidden="true"></span>
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        <span id="label-btn-salvar-lab">Salvar Laboratório</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/laboratorios.js"></script>
</body>
</html>
