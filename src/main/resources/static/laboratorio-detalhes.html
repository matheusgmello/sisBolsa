<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Laboratório - SisBolsa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/detalhes-laboratorio.css">
</head>
<body>
    <div class="main-content">
        <div class="header-actions">
            <div>
                <h1 id="nome-lab">Carregando Laboratório...</h1>
                <p class="header-subtitle">Visão executiva de projetos, ocupação de vagas e bolsistas</p>
            </div>
            <div class="header-buttons">
                <a href="/laboratorios.html" class="btn-new btn-export">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    <span>Voltar para Laboratórios</span>
                </a>
            </div>
        </div>

        <div id="avisos" aria-live="polite" role="status"></div>

        <div class="tabs-container" role="tablist" aria-label="Abas do laboratório">
            <button class="tab-btn active" data-tab="visao-geral" role="tab" aria-selected="true" aria-controls="visao-geral">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
                <span>Visão Geral</span>
            </button>
            <button class="tab-btn" data-tab="projetos" role="tab" aria-selected="false" aria-controls="projetos">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                <span id="aba-projetos">Projetos</span>
            </button>
            <button class="tab-btn" data-tab="equipe" role="tab" aria-selected="false" aria-controls="equipe">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span id="aba-equipe">Equipe</span>
            </button>
        </div>

        <div id="visao-geral" class="tab-content active" role="tabpanel" aria-labelledby="visao-geral"></div>
        <div id="projetos" class="tab-content" role="tabpanel" aria-labelledby="projetos"></div>
        <div id="equipe" class="tab-content" role="tabpanel" aria-labelledby="equipe"></div>
    </div>

    <!-- Modal Novo Projeto -->
    <div class="modal-overlay" id="modal-novo-projeto" role="dialog" aria-modal="true" aria-labelledby="modal-projeto-titulo">
        <div class="modal-dialog">
            <div class="modal-header">
                <h2 id="modal-projeto-titulo">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--primary-color);"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                    <span>Adicionar Novo Projeto</span>
                </h2>
                <button type="button" class="modal-close-btn" data-fecha-modal="modal-novo-projeto" aria-label="Fechar janela modal">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="form-novo-projeto">
                <div class="modal-body">
                    <div class="form-group" style="margin-bottom: 16px;">
                        <label for="nomeProjeto" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Título do Projeto <span class="asterisco">*</span></label>
                        <input type="text" id="nomeProjeto" required minlength="3" placeholder="Ex: Inteligência Artificial Aplicada" style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;">
                    </div>
                    <div class="form-group">
                        <label for="descProjeto" style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:block;">Descrição do Projeto</label>
                        <textarea id="descProjeto" rows="4" placeholder="Breve resumo dos objetivos, tecnologias e escopo..." style="width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-grid);background-color:var(--surface-color);font-family:inherit;font-size:0.875rem;box-sizing:border-box;resize:vertical;"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" data-fecha-modal="modal-novo-projeto" style="flex:0 1 auto;padding:9px 18px;">Cancelar</button>
                    <button type="submit" class="btn btn-submit" id="btn-salvar-proj" style="flex:0 1 auto;padding:9px 20px;">
                        <span class="btn-spinner" aria-hidden="true"></span>
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M20 6 9 17l-5-5"/></svg>
                        <span>Cadastrar Projeto</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/laboratorio-detalhes.js"></script>
</body>
</html>
