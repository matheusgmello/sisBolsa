<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Laboratório - SisBolsa</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/detalhes-laboratorio.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-content">
        <div class="container">
            <div class="lab-header">
                <h1><i class="fas fa-flask"></i> <span id="nome-lab"></span></h1>
                <a href="/laboratorios.html" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar</a>
            </div>

            <div id="avisos"></div>

            <div class="tabs-container">
                <button class="tab-btn active" data-tab="visao-geral"><i class="fas fa-chart-pie"></i> Visão Geral</button>
                <button class="tab-btn" data-tab="projetos"><i class="fas fa-project-diagram"></i> <span id="aba-projetos">Projetos</span></button>
                <button class="tab-btn" data-tab="equipe"><i class="fas fa-users"></i> <span id="aba-equipe">Equipe</span></button>
            </div>

            <div id="visao-geral" class="tab-content active"></div>
            <div id="projetos" class="tab-content"></div>
            <div id="equipe" class="tab-content"></div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/laboratorio-detalhes.js"></script>
</body>
</html>
