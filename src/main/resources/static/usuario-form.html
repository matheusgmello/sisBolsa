<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuário - SisBolsa</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cadastro-bolsista.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-content">
        <div class="container form-container">
            <h1><i class="fas fa-user-plus"></i> <span id="titulo">Cadastrar Novo Usuário</span></h1>
            <p class="legenda-obrigatorio"><span class="asterisco">*</span> Campos obrigatórios</p>

            <div id="avisos"></div>

            <form id="formBolsista">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label>Nome Completo <span class="asterisco">*</span></label>
                        <input type="text" id="nome" required minlength="3" placeholder="Ex: João da Silva">
                    </div>
                    <div class="form-group" id="group-dataNascimento">
                        <label>Data de Nascimento <span class="asterisco">*</span></label>
                        <input type="date" id="dataNascimento" required>
                    </div>
                    <div class="form-group" id="group-curso">
                        <label>Curso <span class="asterisco">*</span></label>
                        <input type="text" id="curso" required placeholder="Ex: Ciência da Computação">
                    </div>
                    <div class="form-group">
                        <label>E-mail <span class="asterisco">*</span></label>
                        <input type="email" id="email" required placeholder="Ex: joao@universidade.edu.br">
                    </div>
                    <div class="form-group" id="group-matricula">
                        <label>Matrícula <span class="asterisco">*</span></label>
                        <input type="text" id="matricula" required placeholder="Ex: 2021001234">
                    </div>
                    <div class="form-group" id="group-tipo" hidden>
                        <label>Tipo de Usuário <span class="asterisco">*</span></label>
                        <select id="tipoUsuario" required>
                            <option value="BOLSISTA">Usuário Bolsista</option>
                            <option value="PROFESSOR">Usuário Professor/Coordenador</option>
                            <option value="ADMIN">Superusuário (Administrador)</option>
                        </select>
                    </div>
                    <div class="form-group" id="group-laboratorio">
                        <label>Laboratório</label>
                        <select id="laboratorioId"><option value="">Selecione um laboratório...</option></select>
                    </div>
                    <div class="form-group" id="group-cargo">
                        <label>Cargo no Laboratório</label>
                        <select id="cargo"><option value="">Selecione um cargo...</option></select>
                    </div>
                    <div class="form-group" id="group-foto" hidden>
                        <label>URL da Foto de Perfil</label>
                        <input type="text" id="fotoUrl" placeholder="https://exemplo.com/foto.jpg">
                    </div>
                    <div class="form-group form-group-full" id="group-bio" hidden>
                        <label>Biografia / Sobre Mim</label>
                        <textarea id="bio" rows="4" placeholder="Escreva um resumo sobre este usuário..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Senha <span class="asterisco" id="senha-obrigatoria">*</span></label>
                        <input type="password" id="senha" minlength="6" placeholder="Mínimo 6 caracteres">
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn btn-submit"><i class="fas fa-save"></i> Salvar</button>
                        <a href="/usuarios.html" class="btn btn-cancel">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/usuario-form.js"></script>
</body>
</html>
