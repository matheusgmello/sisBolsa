<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuário - SisBolsa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cadastro-bolsista.css">
</head>
<body>
    <div class="main-content">
        <div class="header-actions">
            <div>
                <h1 id="titulo">Cadastrar Novo Usuário</h1>
                <p class="legenda-obrigatorio"><span class="asterisco">*</span> Campos marcados com asterisco são obrigatórios</p>
            </div>
            <div class="header-buttons">
                <a href="/usuarios.html" class="btn-new btn-export">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    <span>Voltar para Lista</span>
                </a>
            </div>
        </div>

        <div id="avisos" aria-live="polite" role="status"></div>

        <div class="container form-container">
            <form id="formBolsista">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label for="nome">Nome Completo <span class="asterisco">*</span></label>
                        <input type="text" id="nome" required minlength="3" placeholder="Ex: João da Silva">
                    </div>
                    <div class="form-group" id="group-dataNascimento">
                        <label for="dataNascimento">Data de Nascimento <span class="asterisco">*</span></label>
                        <input type="date" id="dataNascimento" required>
                    </div>
                    <div class="form-group" id="group-curso">
                        <label for="curso">Curso <span class="asterisco">*</span></label>
                        <input type="text" id="curso" required placeholder="Ex: Ciência da Computação">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail de Acesso <span class="asterisco">*</span></label>
                        <input type="email" id="email" required placeholder="Ex: joao@universidade.edu.br">
                    </div>
                    <div class="form-group" id="group-matricula">
                        <label for="matricula">Matrícula <span class="asterisco">*</span></label>
                        <input type="text" id="matricula" required placeholder="Ex: 2021001234">
                    </div>
                    <div class="form-group" id="group-tipo" hidden>
                        <label for="tipoUsuario">Tipo de Usuário <span class="asterisco">*</span></label>
                        <select id="tipoUsuario" required>
                            <option value="BOLSISTA">Usuário Bolsista</option>
                            <option value="PROFESSOR">Usuário Professor/Coordenador</option>
                            <option value="ADMIN">Superusuário (Administrador)</option>
                        </select>
                    </div>
                    <div class="form-group" id="group-laboratorio">
                        <label for="laboratorioId">Laboratório Vinculado</label>
                        <select id="laboratorioId"><option value="">Selecione um laboratório...</option></select>
                    </div>
                    <div class="form-group" id="group-cargo">
                        <label for="cargo">Cargo no Laboratório</label>
                        <select id="cargo"><option value="">Selecione um cargo...</option></select>
                    </div>
                    <div class="form-group" id="group-foto" hidden>
                        <label for="fotoUrl">URL da Foto de Perfil</label>
                        <input type="url" id="fotoUrl" placeholder="https://exemplo.com/foto.jpg">
                    </div>
                    <div class="form-group form-group-full">
                        <label for="senha">Senha <span class="asterisco" id="senha-obrigatoria">*</span></label>
                        <div class="password-field-wrapper">
                            <input type="password" id="senha" minlength="6" placeholder="Mínimo de 6 caracteres">
                            <button type="button" class="password-toggle-btn" data-target="senha" aria-label="Mostrar ou ocultar senha">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn btn-submit" id="btn-submit">
                            <span class="btn-spinner" aria-hidden="true"></span>
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                            <span class="btn-text">Salvar Usuário</span>
                        </button>
                        <a href="/usuarios.html" class="btn btn-cancel">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/sessao.js"></script>
    <script src="/js/usuario-form.js"></script>
</body>
</html>
